<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">FDE 擴編前的誠實自測</title>
  <desc id="desc">左右兩張職缺卡比較沒有共用平台與有共用平台時，前線部署工程師面對的維護工作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f1d2e"/>
      <stop offset="1" stop-color="#261522"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12372f"/>
      <stop offset="1" stop-color="#102720"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <style>
      text { font-family: "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif; }
      .muted { fill: #a5b4fc; font-size: 20px; }
      .label { fill: #cbd5e1; font-size: 19px; font-weight: 600; }
      .small { fill: #e2e8f0; font-size: 18px; }
    </style>
  </defs>

  <rect width="1200" height="675" rx="32" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="180" fill="#4f46e5" opacity="0.12"/>
  <circle cx="120" cy="635" r="220" fill="#0ea5e9" opacity="0.08"/>

  <text x="70" y="70" fill="#f8fafc" font-size="36" font-weight="750">FDE 擴編前的誠實自測</text>
  <text x="70" y="105" class="muted">同一個職缺，兩種底層條件</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="500" height="420" rx="24" fill="url(#redCard)" stroke="#fb7185" stroke-width="2"/>
    <rect x="630" y="145" width="500" height="420" rx="24" fill="url(#greenCard)" stroke="#34d399" stroke-width="2"/>
  </g>

  <circle cx="108" cy="184" r="10" fill="#fb7185"/>
  <text x="130" y="193" fill="#fecdd3" font-size="25" font-weight="700">沒有共用平台</text>
  <text x="680" y="193" fill="#a7f3d0" font-size="25" font-weight="700">有共用平台</text>
  <circle cx="658" cy="184" r="10" fill="#34d399"/>

  <g>
    <rect x="106" y="225" width="132" height="48" rx="12" fill="#7f1d1d"/>
    <rect x="253" y="225" width="132" height="48" rx="12" fill="#7f1d1d"/>
    <rect x="400" y="225" width="132" height="48" rx="12" fill="#7f1d1d"/>
    <text x="128" y="256" class="small">需求 01 repo</text>
    <text x="275" y="256" class="small">需求 02 repo</text>
    <text x="422" y="256" class="small">需求 55 repo</text>
    <path d="M172 285v35M319 285v35M466 285v35" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
    <path d="M172 320h294" stroke="#fda4af" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="106" y="345" width="428" height="82" rx="18" fill="#fff1f2"/>
  <text x="130" y="377" fill="#881337" font-size="18" font-weight="650">招募訊息</text>
  <text x="130" y="408" fill="#4c0519" font-size="20">需要一位能維護 55 個 repo 的 FDE</text>

  <rect x="166" y="447" width="368" height="72" rx="18" fill="#1e293b"/>
  <text x="190" y="477" fill="#94a3b8" font-size="17" font-weight="650">候選人</text>
  <text x="190" y="505" fill="#f8fafc" font-size="19">這更像人形套件管理器</text>

  <g>
    <rect x="674" y="225" width="412" height="72" rx="16" fill="#064e3b" stroke="#34d399"/>
    <text x="700" y="254" class="label">共用平台能力</text>
    <text x="700" y="282" fill="#d1fae5" font-size="19">資料模型　動作　權限</text>

    <path d="M750 309v34M880 309v34M1010 309v34" stroke="#6ee7b7" stroke-width="3" stroke-linecap="round"/>
    <rect x="674" y="343" width="118" height="64" rx="14" fill="#1e3a3a" stroke="#5eead4"/>
    <rect x="821" y="343" width="118" height="64" rx="14" fill="#1e3a3a" stroke="#5eead4"/>
    <rect x="968" y="343" width="118" height="64" rx="14" fill="#1e3a3a" stroke="#5eead4"/>
    <text x="694" y="382" class="small">需求 01</text>
    <text x="841" y="382" class="small">需求 02</text>
    <text x="988" y="382" class="small">需求 55</text>
  </g>

  <rect x="674" y="447" width="412" height="72" rx="18" fill="#ecfdf5"/>
  <text x="698" y="477" fill="#065f46" font-size="17" font-weight="650">工程團隊</text>
  <text x="698" y="505" fill="#022c22" font-size="19">現在可以談客製化</text>

  <rect x="333" y="600" width="534" height="46" rx="23" fill="#312e81" stroke="#818cf8"/>
  <text x="600" y="630" text-anchor="middle" fill="#eef2ff" font-size="21" font-weight="650">職稱沒變，單位經濟先變了</text>
</svg>
