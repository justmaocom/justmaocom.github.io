<g filter="url(#sh)"><rect x="64" y="238" width="760" height="618" rx="28" fill="#fff" stroke="#8b5cf6" stroke-width="5"/></g><rect x="96" y="208" width="228.0" height="60" rx="30" fill="url(#chip)"/><g transform="translate(137,235) scale(1.0)"><path d="M-9 -2 V-10 A9 9 0 0 1 9 -10 V-2" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/><rect x="-14" y="-3" width="28" height="22" rx="5" fill="#fff"/></g><text x="166" y="249" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="800" fill="#fff">Sandbox</text><rect x="100" y="296" width="688" height="188" rx="22" fill="#1e1b4b"/><g transform="translate(170,398) scale(1.0)"><line x1="0" y1="-62" x2="0" y2="-44" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/><circle cx="0" cy="-66" r="6" fill="#c4b5fd"/><circle cx="0" cy="-18" r="26" fill="#c4b5fd"/><path d="M-36 46 Q-36 14 0 14 Q36 14 36 46 Z" fill="#c4b5fd"/><circle cx="-9" cy="-20" r="4" fill="#1e1b4b"/><circle cx="9" cy="-20" r="4" fill="#1e1b4b"/></g><text x="238" y="362" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="34" font-weight="800" fill="#fff">Commands Claude runs</text><text x="238" y="412" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="27" font-weight="600" fill="#c4b5fd">Bash, PowerShell, Monitor</text><text x="238" y="452" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="27" font-weight="500" fill="#c4b5fd">and the processes they start</text><text x="104" y="540" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="700" letter-spacing="1" fill="#475569">Defaults once it&#x27;s on</text><rect x="104" y="568" width="161.0" height="52" rx="26" fill="#3b82f6"/><text x="184.5" y="603" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">Write</text><text x="287.0" y="604" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b">Working dir and temp folder only</text><rect x="104" y="642" width="161.0" height="52" rx="26" fill="#10b981"/><text x="184.5" y="677" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">Network</text><text x="287.0" y="678" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b">Via proxy; others depend on mode</text><rect x="104" y="716" width="161.0" height="52" rx="26" fill="#f59e0b"/><text x="184.5" y="751" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">Read</text><text x="287.0" y="752" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b">Almost the whole machine</text><rect x="287.0" y="773" width="124.8" height="44" rx="10" fill="#ffe4ea"/><text x="299.0" y="804" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="28" font-weight="700" fill="#9f1239">~/.ssh</text><path d="M295.0 809 L403.8 781" stroke="#f0567a" stroke-width="3" stroke-linecap="round"/><text xml:space="preserve" x="425.8" y="804" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="500" fill="#475569"><tspan>blocked by </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="23" font-weight="700">credentials</tspan><tspan> deny</tspan></text><rect x="872" y="208" width="174.0" height="60" rx="30" fill="#fff" stroke="#1e1b4b" stroke-width="3"/><text x="959.0" y="249" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="800" fill="#1e1b4b">Outside</text><rect x="872" y="296" width="322.0" height="46" rx="23.0" fill="#3b82f6"/><text x="1033.0" y="327.6" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="700" fill="#fff">Follow permission rules</text><g filter="url(#sh)"><rect x="872" y="356" width="664" height="84" rx="20" fill="#fff"/></g><path d="M892 356 Q872 356 872 376 V420 Q872 440 892 440 H882 V356 Z" fill="#3b82f6"/><text xml:space="preserve" x="908" y="408" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b"><tspan>File tools </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="26" font-weight="700" fill="#8b5cf6">Read / Edit / Write</tspan><tspan>, </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="26" font-weight="700" fill="#8b5cf6">WebFetch</tspan></text><rect x="872" y="486" width="405.0" height="46" rx="23.0" fill="#f0567a"/><text x="1074.5" y="517.6" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="700" fill="#fff">Run with your full permissions</text><g filter="url(#sh)"><rect x="872" y="546" width="664" height="84" rx="20" fill="#fff"/></g><path d="M892 546 Q872 546 872 566 V610 Q872 630 892 630 H882 V546 Z" fill="#f0567a"/><text xml:space="preserve" x="908" y="598" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b"><tspan>Hooks, MCP servers, LSP, status line</tspan></text><g filter="url(#sh)"><rect x="872" y="659" width="664" height="84" rx="20" fill="#fff"/></g><path d="M892 659 Q872 659 872 679 V723 Q872 743 892 743 H882 V659 Z" fill="#f0567a"/><text xml:space="preserve" x="908" y="711" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="600" fill="#1e1b4b"><tspan>Commands you type after </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="26" font-weight="700" fill="#8b5cf6">!</tspan></text><g filter="url(#sh)"><rect x="872" y="772" width="664" height="84" rx="20" fill="#fff"/></g><path d="M892 772 Q872 772 872 792 V836 Q872 856 892 856 H882 V772 Z" fill="#f0567a"/><text