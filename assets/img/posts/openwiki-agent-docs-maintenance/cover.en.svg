<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" font-family="'Avenir Next','PingFang TC',sans-serif">
  <title id="title">OpenWiki Can Track Code Changes, but It Can&#x27;t Prove the Docs Are Correct</title>
  <desc id="desc">Two result cards: cited code is still current, checked; the statement is correct, needs review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/><stop offset="0.5" stop-color="#FDF2F8"/><stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="560" cy="-30" r="120" fill="#C7D2FE" opacity="0.55"/>
  <circle cx="1130" cy="60" r="150" fill="#FDE68A" opacity="0.45"/>
  <circle cx="20" cy="640" r="130" fill="#FECDD3" opacity="0.55"/>
  <circle cx="700" cy="660" r="130" fill="#A7F3D0" opacity="0.50"/>
  <rect x="72" y="84" width="357" height="36" rx="18" fill="none" stroke="#1E1B4B" stroke-width="2.5"/>
  <text x="251" y="109" font-size="16" font-weight="700" letter-spacing="2.2" text-anchor="middle" fill="#1E1B4B">SOURCE DEEP DIVE · OPENWIKI</text>
  <text x="72" y="200" font-size="43" font-weight="700" fill="#1E1B4B">OpenWiki Can Track Code</text><text x="72" y="257" font-size="43" font-weight="700" fill="#1E1B4B">Changes, but It Can&#x27;t Prove</text><text x="72" y="314" font-size="43" font-weight="700" fill="#1E1B4B">the Docs Are Correct</text>
  <text x="72" y="378" font-size="23" font-weight="500" fill="#44415F">Green source checks only mean the citations</text><text x="72" y="414" font-size="23" font-weight="500" fill="#44415F">aren&#x27;t stale: a look at what v0.5.2 checks</text>
  <rect x="740" y="180" width="412" height="112" rx="18" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/><circle cx="798" cy="236" r="28" fill="#10B981"/><path d="M785 237 l9 10 l18 -21" stroke="#fff" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="844" y="230" font-size="22" font-weight="700" fill="#1E1B4B">Cited code is still current</text><rect x="844" y="244" width="104" height="30" rx="15" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="896" y="265" font-size="17" font-weight="700" text-anchor="middle" fill="#1E1B4B">Checked</text><rect x="740" y="330" width="412" height="112" rx="18" fill="#FFFFFF" stroke="#F59E0B" stroke-width="3" filter="url(#shadow)"/><circle cx="798" cy="386" r="28" fill="#F59E0B"/><text x="798" y="397" font-size="32" font-weight="700" text-anchor="middle" fill="#fff">?</text><text x="844" y="380" font-size="22" font-weight="700" fill="#1E1B4B">The statement is correct</text><rect x="844" y="394" width="156" height="30" rx="15" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="922" y="415" font-size="17" font-weight="700" text-anchor="middle" fill="#1E1B4B">Needs review</text>
</svg>
