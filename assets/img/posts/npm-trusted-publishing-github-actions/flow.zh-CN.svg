<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9ee"/><stop offset="1" stop-color="#e3f7ef"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ffbf2e"/></linearGradient><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#123c3a" opacity="0.10"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="900" y="560" width="700" height="340" fill="url(#dots)"/><path d="M1500 94 L1504 106 L1516 110 L1504 114 L1500 126 L1496 114 L1484 110 L1496 106 Z" fill="#ff6b4a"/><path d="M1036 90 q12 -14 24 0 t24 0" fill="none" stroke="#0ea5a0" stroke-width="5" stroke-linecap="round"/><rect x="50" y="320" width="20" height="20" rx="4" fill="none" stroke="#ffbf2e" stroke-width="4" transform="rotate(20 60 330)"/><circle cx="1540" cy="420" r="9" fill="#ffbf2e"/><rect x="60" y="50" width="187.2" height="48" rx="10" fill="#123c3a"/><text x="82" y="82" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#ffbf2e">NPM · 流程</text><text x="60" y="170" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="54" font-weight="900" fill="#123c3a" text-anchor="start"><tspan>不放 token，怎么发布？</tspan></text><text x="62" y="222" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>每一次发布都当场换一张短期凭证</tspan></text><polyline points="235.0,675.0 615.0,565.0 995.0,455.0 1375.0,345.0" fill="none" stroke="#123c3a" stroke-width="6" stroke-dasharray="2 16" stroke-linecap="round"/><g><rect x="60" y="572" width="370" height="230" rx="20" fill="#3aa8f0"/><rect x="50" y="560" width="370" height="230" rx="20" fill="#fff" stroke="#123c3a" stroke-width="4"/></g><circle cx="390" cy="560" r="28" fill="#3aa8f0" stroke="#123c3a" stroke-width="4"/><text x="390" y="571" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">1</text><text x="76" y="620" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="27" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>GitHub Actions 开始运行</tspan></text><line x1="74" y1="652" x2="396" y2="652" stroke="#3aa8f0" stroke-width="4"/><text x="76" y="700" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#0ea5a0">id-token: write</tspan></text><text x="76" y="748" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>GitHub 托管的 runner</tspan></text><g><rect x="440" y="462" width="370" height="230" rx="20" fill="#0ea5a0"/><rect x="430" y="450" width="370" height="230" rx="20" fill="#fff" stroke="#123c3a" stroke-width="4"/></g><circle cx="770" cy="450" r="28" fill="#0ea5a0" stroke="#123c3a" stroke-width="4"/><text x="770" y="461" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">2</text><text x="456" y="510" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="27" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>GitHub 发身份证明</tspan></text><line x1="454" y1="542" x2="776" y2="542" stroke="#0ea5a0" stroke-width="4"/><text x="456" y="590" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>OIDC token（JWT）</tspan></text><text x="456" y="638" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>写明哪个 repo、workflow</tspan></text><g><rect x="820" y="352" width="370" height="230" rx="20" fill="#ffbf2e"/><rect x="810" y="340" width="370" height="230" rx="20" fill="#fff" stroke="#123c3a" stroke-width="4"/></g><circle cx="1150" cy="340" r="28" fill="#ffbf2e" stroke="#123c3a" stroke-width="4"/><text x="1150" y="351" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">3</text><text x="836" y="400" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="27" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>npm 核对配置</tspan></text><line x1="834" y1="432" x2="1156" y2="432" stroke="#ffbf2e" stroke-width="4"/><text x="836" y="480" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>组织、repo、workflow 文件名</tspan></text><text x="836" y="528" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>都相符才换发短期凭证</tspan></text><g><rect x="1200" y="242" width="370" height="230" rx="20" fill="#ff6b4a"/><rect x="1190" y="230" width="370" height="230" rx="20" fill="#fff" stroke="#123c3a" stroke-width="4"/></g><circle cx="1530" cy="230" r="28" fill="#ff6b4a" stroke="#123c3a" stroke-width="4"/><text x="1530" y="241" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">4</text><text x="1216" y="290" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="27" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>npm publish 上架</tspan></text><line x1="1214" y1="322" x2="1536" y2="322" stroke="#ff6b4a" stroke-width="4"/><text x="1216" y="370" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>公开 repo＋公开包</tspan></text><text x="1216" y="418" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="23" font-weight="500" fill="#123c3a" text-anchor="start"><tspan>自动附上 provenance</tspan></text><rect x="60" y="822" width="1480" height="56" rx="28" fill="#123c3a"/><text x="800.0" y="859" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="24" font-weight="600" fill="#fff" text-anchor="middle"><tspan>发布这一步不需要 npm token；安装私有依赖包仍要 read-only token</tspan></text></svg>