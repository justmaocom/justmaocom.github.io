<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff9ee"/><stop offset="1" stop-color="#e3f7ef"/></linearGradient><linearGradient id="chip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff6b4a"/><stop offset="1" stop-color="#ffbf2e"/></linearGradient><pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2.4" fill="#123c3a" opacity="0.10"/></pattern></defs><rect width="1600" height="900" fill="url(#bg)"/><rect x="0" y="600" width="520" height="300" fill="url(#dots)"/><path d="M1520 54 L1524 66 L1536 70 L1524 74 L1520 86 L1516 74 L1504 70 L1516 66 Z" fill="#0ea5a0"/><path d="M1156 60 q12 -14 24 0 t24 0" fill="none" stroke="#ff6b4a" stroke-width="5" stroke-linecap="round"/><circle cx="1040" cy="860" r="9" fill="#ffbf2e"/><rect x="60" y="50" width="235.2" height="48" rx="10" fill="#123c3a"/><text x="82" y="82" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#ffbf2e">NPM · 设置清单</text><text x="60" y="166" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="54" font-weight="900" fill="#123c3a" text-anchor="start"><tspan>按顺序做一遍</tspan></text><line x1="90" y1="255" x2="90" y2="775" stroke="#123c3a" stroke-width="4" stroke-dasharray="2 12" stroke-linecap="round"/><rect x="60" y="225" width="60" height="60" rx="14" fill="#3aa8f0" stroke="#123c3a" stroke-width="3"/><text x="90" y="266" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">1</text><text x="146" y="251" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>版本够新</tspan></text><text x="146" y="291" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>npm CLI ≥ 11.5.1、Node ≥ 22.14.0（Node 22 自带 npm 10，要升级）</tspan></text><rect x="60" y="329" width="60" height="60" rx="14" fill="#0ea5a0" stroke="#123c3a" stroke-width="3"/><text x="90" y="370" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">2</text><text x="146" y="355" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>package.json 对上 repo</tspan></text><text x="146" y="395" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#0ea5a0">repository.url</tspan><tspan> 要和 GitHub repo 完全一致</tspan></text><rect x="60" y="433" width="60" height="60" rx="14" fill="#65b741" stroke="#123c3a" stroke-width="3"/><text x="90" y="474" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">3</text><text x="146" y="459" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>在 npmjs.com 填表</tspan></text><text x="146" y="499" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>组织或用户、Repository、Workflow filename（只填文件名）</tspan></text><rect x="60" y="537" width="60" height="60" rx="14" fill="#ffbf2e" stroke="#123c3a" stroke-width="3"/><text x="90" y="578" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">4</text><text x="146" y="563" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>勾选允许的操作</tspan></text><text x="146" y="603" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>Allowed actions 勾 </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#0ea5a0">npm publish</tspan><tspan>，或只用 </tspan><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#0ea5a0">npm stage publish</tspan></text><rect x="60" y="641" width="60" height="60" rx="14" fill="#ff6b4a" stroke="#123c3a" stroke-width="3"/><text x="90" y="682" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">5</text><text x="146" y="667" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>workflow 给权限</tspan></text><text x="146" y="707" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#0ea5a0">permissions: id-token: write</tspan><tspan>，2 天内完成第一次发布</tspan></text><rect x="60" y="745" width="60" height="60" rx="14" fill="#0ea5a0" stroke="#123c3a" stroke-width="3"/><text x="90" y="786" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#123c3a">6</text><text x="146" y="771" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="28" font-weight="800" fill="#123c3a" text-anchor="start"><tspan>成功后收掉旧 token</tspan></text><text x="146" y="811" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="22" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>Publishing access 改成禁止 token，撤销旧的 token</tspan></text><g transform="rotate(3 1310.0 510.0)"><rect x="1085" y="262" width="470" height="520" rx="20" fill="#ff6b4a"/><rect x="1075" y="250" width="470" height="520" rx="20" fill="#fff1c9" stroke="#123c3a" stroke-width="4"/></g><g transform="rotate(3 1310.0 510.0)"><rect x="1250.0" y="232" width="120" height="36" rx="6" fill="#0ea5a0" opacity="0.85"/><text x="1111" y="326" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="34" font-weight="900" fill="#123c3a" text-anchor="start"><tspan>先了解的限制</tspan></text><circle cx="1123" cy="391" r="14" fill="#ff6b4a"/><text x="1123" y="399" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#fff">!</text><text x="1151" y="400" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="24" font-weight="700" fill="#123c3a" text-anchor="start"><tspan>不支持 self-hosted runner</tspan></text><text x="1151" y="434" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="21" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>只能用 GitHub 托管的 runner</tspan></text><circle cx="1123" cy="483" r="14" fill="#ff6b4a"/><text x="1123" y="491" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#fff">!</text><text x="1151" y="492" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="24" font-weight="700" fill="#123c3a" text-anchor="start"><tspan>没有 provenance 的情况</tspan></text><text x="1151" y="526" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="21" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>private repo（包公开也一样）</tspan></text><circle cx="1123" cy="575" r="14" fill="#ff6b4a"/><text x="1123" y="583" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#fff">!</text><text x="1151" y="584" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="24" font-weight="700" fill="#123c3a" text-anchor="start"><tspan>装私有包仍要 token</tspan></text><text x="1151" y="618" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="21" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>用 read-only 的 granular token</tspan></text><circle cx="1123" cy="667" r="14" fill="#ff6b4a"/><text x="1123" y="675" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#fff">!</text><text x="1151" y="676" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="24" font-weight="700" fill="#123c3a" text-anchor="start"><tspan>最多 10 个 publisher</tspan></text><text x="1151" y="710" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="21" font-weight="500" fill="#5f7774" text-anchor="start"><tspan>部分界面一次只能设 1 个</tspan></text></g></svg>