 width="14" height="96" rx="7" fill="#ff5c9a" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="767.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="767" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI10</text><text x="1021.0" y="767" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#ff5c9a" text-anchor="start"><tspan>失控的 agent</tspan></text><text x="931.0" y="805.0" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>它出错时，你说不出怎么马上停掉它、撤销它的 </tspan></text><text x="931.0" y="837.5" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>token 吗？</tspan></text><path d="M1516 70 H1544 M1530 56 V84" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/><circle cx="1460" cy="58" r="12" fill="none" stroke="#2f9bff" stroke-width="6"/></svg>