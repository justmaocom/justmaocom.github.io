troke="#2d1b4e" stroke-width="4"/><text x="931.0" y="175" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI02</text><text x="1021.0" y="175" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" text-anchor="start"><tspan>工具被误用</tspan></text><text x="931.0" y="213.0" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>有没有自动放行的工具能删文件、发送或联网？</tspan></text><g><rect x="67.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="323.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="323" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI03</text><text x="266.0" y="323" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="20" font-weight="800" fill="#2f9bff" text-anchor="start"><tspan>身份与权限滥用</tspan></text><text x="176.0" y="361.0" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>它用的是你的完整账号、长期 token 或 SSH key </tspan></text><text x="176.0" y="393.5" font-family="'Noto Sans CJK SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>吗？</tspan></text><g><rect x="822.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="323.0" width="48" 