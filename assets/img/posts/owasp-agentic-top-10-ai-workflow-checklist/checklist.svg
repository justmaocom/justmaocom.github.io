troke="#2d1b4e" stroke-width="4"/><text x="931.0" y="175" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI02</text><text x="1021.0" y="175" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" text-anchor="start"><tspan>工具被誤用</tspan></text><text x="931.0" y="213.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>有沒有自動放行的工具能刪檔、發送或連網？</tspan></text><g><rect x="67.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="323.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="323" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI03</text><text x="266.0" y="323" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#2f9bff" text-anchor="start"><tspan>身分與權限濫用</tspan></text><text x="176.0" y="361.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>它用的是你的完整帳號、長期 token 或 SSH key </tspan></text><text x="176.0" y="393.5" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>嗎？</tspan></text><g><rect x="822.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="323.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="323" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI04</text><text x="1021.0" y="323" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#2f9bff" text-anchor="start"><tspan>供應鏈</tspan></text><text x="931.0" y="361.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>有沒有 MCP、skill 或外掛沒鎖版本、來源沒看過？</tspan></text><g><rect x="67.0" y="438" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="431" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="447" width="14" height="96" rx="7" fill="#ff8a3d" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="471.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="471" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI05</text><text x="266.0" y="471" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" text-anchor="start"><tspan>意外執行程式碼</tspan></text><text x="176.0" y="509.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>它跑的指令直接在你的主機上，沒有沙箱嗎？</tspan></text><g><rect x="822.0" y="438" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="431" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="447" width="14" height="96" rx="7" fill="#7b5cff" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="471.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="471" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI06</text><text x="1021.0" y="471" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#7b5cff" text-anchor="start"><tspan>記憶與脈絡污染</tspan></text><text x="931.0" y="509.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>它能自己改 CLAUDE.md、AGENTS.md 或記憶檔，</tspan></text><text x="931.0" y="541.5" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>你卻看不到 diff 嗎？</tspan></text><g><rect x="67.0" y="586" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="579" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="595" width="14" height="96" rx="7" fill="#ff5c9a" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="619.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="619" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI07</text><text x="266.0" y="619" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="20" font-weight="800" fill="#ff5c9a" text-anchor="start"><tspan>agent 間通訊</tspan></text><text x="176.0" y="657.0" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>一個 agent 的輸出，會被另一個 agent 直接照著做</tspan></text><text x="176.0" y="689.5" font-family="'Noto Sans CJK TC','Noto Sans TC',sans-serif" font-size="25" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>嗎？</tspan></text><g><rect x="822.0" y="586" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="579" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="595" width="14" height="96" rx=