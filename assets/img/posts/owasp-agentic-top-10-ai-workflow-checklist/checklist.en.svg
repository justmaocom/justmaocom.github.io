height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="151" width="14" height="96" rx="7" fill="#ff8a3d" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="175.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="175" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI02</text><text x="1019.0" y="175" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" text-anchor="start"><tspan>Tool Misuse</tspan></text><text x="931.0" y="213.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Can any auto-approved tool delete files, send</tspan></text><text x="931.0" y="242.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>data, or reach the network?</tspan></text><g><rect x="67.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="323.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="323" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI03</text><text x="264.0" y="323" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#2f9bff" text-anchor="start"><tspan>Identity &amp; Privilege</tspan></text><text x="176.0" y="361.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Does it run with your full account, a long-lived</tspan></text><text x="176.0" y="390.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>token, or your SSH key?</tspan></text><g><rect x="822.0" y="290" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="283" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="299" width="14" height="96" rx="7" fill="#2f9bff" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="323.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="323" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI04</text><text x="1019.0" y="323" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#2f9bff" text-anchor="start"><tspan>Supply Chain</tspan></text><text x="931.0" y="361.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Is any MCP server, skill, or plugin unpinned or</tspan></text><text x="931.0" y="390.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>from an unreviewed source?</tspan></text><g><rect x="67.0" y="438" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="431" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="447" width="14" height="96" rx="7" fill="#ff8a3d" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="471.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="471" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI05</text><text x="264.0" y="471" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#ff8a3d" text-anchor="start"><tspan>Unexpected Code Exec</tspan></text><text x="176.0" y="509.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Do its commands run straight on your machine,</tspan></text><text x="176.0" y="538.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>with no sandbox?</tspan></text><g><rect x="822.0" y="438" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="431" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="447" width="14" height="96" rx="7" fill="#7b5cff" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="471.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="471" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI06</text><text x="1019.0" y="471" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#7b5cff" text-anchor="start"><tspan>Memory Poisoning</tspan></text><text x="931.0" y="509.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Can it edit CLAUDE.md, AGENTS.md, or memory</tspan></text><text x="931.0" y="538.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>files without you seeing a diff?</tspan></text><g><rect x="67.0" y="586" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="579" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="595" width="14" height="96" rx="7" fill="#ff5c9a" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="619.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="619" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI07</text><text x="264.0" y="619" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#ff5c9a" text-anchor="start"><tspan>Inter-Agent Comms</tspan></text><text x="176.0" y="657.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Does one agent act on another agent&#x27;s output</tspan></text><text x="176.0" y="686.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>without a check?</tspan></text><g><rect x="822.0" y="586" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="579" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="595" width="14" height="96" rx="7" fill="#ff5c9a" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="619.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="619" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI08</text><text x="1019.0" y="619" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#ff5c9a" text-anchor="start"><tspan>Cascading Failures</tspan></text><text x="931.0" y="657.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>From code to merge to deploy, is any stretch</tspan></text><text x="931.0" y="686.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>unguarded by a person or check?</tspan></text><g><rect x="67.0" y="734" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="60.0" y="727" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="70.0" y="743" width="14" height="96" rx="7" fill="#ffd23f" stroke="#2d1b4e" stroke-width="2"/><rect x="104.0" y="767.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="176.0" y="767" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI09</text><text x="264.0" y="767" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#b8860b" text-anchor="start"><tspan>Human Trust</tspan></text><text x="176.0" y="805.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>Do you often click Allow without really reading?</tspan></text><g><rect x="822.0" y="734" width="725.0" height="128" rx="16" fill="#2d1b4e"/><rect x="815.0" y="727" width="725.0" height="128" rx="16" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/></g><rect x="825.0" y="743" width="14" height="96" rx="7" fill="#ff5c9a" stroke="#2d1b4e" stroke-width="2"/><rect x="859.0" y="767.0" width="48" height="48" rx="10" fill="#ffffff" stroke="#2d1b4e" stroke-width="4"/><text x="931.0" y="767" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="20" font-weight="800" fill="#6b5f80">ASI10</text><text x="1019.0" y="767" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="20" font-weight="800" fill="#ff5c9a" text-anchor="start"><tspan>Rogue Agents</tspan></text><text x="931.0" y="805.0" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>If it goes wrong, would you be unsure how to stop</tspan></text><text x="931.0" y="834.9" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="700" fill="#2d1b4e" text-anchor="start"><tspan>it and revoke its tokens?</tspan></text><path d="M1516 70 H1544 M1530 56 V84" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round"/><circle cx="1460" cy="58" r="12" fill="none" stroke="#2f9bff" stroke-width="6"/></svg>