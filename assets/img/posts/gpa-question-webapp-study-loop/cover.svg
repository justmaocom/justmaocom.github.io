<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc" font-family="'Avenir Next','PingFang TC',sans-serif">
  <title id="title">採購法 PDF 題庫變成 不靠題序記憶的練習網站</title>
  <desc id="desc">三個步驟：解析 PDF 題庫、每次隨機組卷、跨練習找出弱項。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/><stop offset="0.5" stop-color="#FDF2F8"/><stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E1B4B" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="560" cy="-30" r="120" fill="#C7D2FE" opacity="0.55"/>
  <circle cx="1130" cy="60" r="150" fill="#FDE68A" opacity="0.45"/>
  <circle cx="20" cy="640" r="130" fill="#FECDD3" opacity="0.55"/>
  <circle cx="700" cy="660" r="130" fill="#A7F3D0" opacity="0.50"/>
  <rect x="72" y="84" width="299" height="36" rx="18" fill="none" stroke="#1E1B4B" stroke-width="2.5"/>
  <text x="222" y="109" font-size="16" font-weight="700" letter-spacing="2.2" text-anchor="middle" fill="#1E1B4B">SIDE PROJECT · FASTAPI</text>
  <text x="72" y="200" font-size="50" font-weight="700" fill="#1E1B4B">採購法 PDF 題庫變成</text><text x="72" y="266" font-size="50" font-weight="700" fill="#1E1B4B">不靠題序記憶的練習網站</text>
  <text x="72" y="330" font-size="23" font-weight="500" fill="#44415F">從解析題庫、隨機組卷，</text><text x="72" y="366" font-size="23" font-weight="500" fill="#44415F">到用跨練習統計找出弱項</text>
