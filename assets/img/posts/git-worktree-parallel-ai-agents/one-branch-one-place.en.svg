<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fc"/><stop offset="1" stop-color="#edf1f8"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.08"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="64" y="76" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="24" letter-spacing="5" fill="#475569">GIT WORKTREE · RULE</text>
<text x="800.0" y="150" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="56" font-weight="800" fill="#1e1b4b">One Branch, One Worktree at a Time</text>
<text x="800.0" y="204" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="500" fill="#475569">If a branch is checked out elsewhere, <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" fill="#8b5cf6" font-weight="700">git worktree add</tspan> refuses</text><rect x="640" y="300" width="320" height="70" rx="35" fill="#8b5cf6"/><text x="800" y="346" text-anchor="middle" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#fff">feature-login</text><g filter="url(#sh)"><rect x="110" y="260" width="430" height="300" rx="22" fill="#fff"/></g><path d="M132 260 Q110 260 110 282 V538 Q110 560 132 560 H120 V260 Z" fill="#10b981"/><text x="150" y="325" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#10b981">../myapp-login</text><circle cx="168" cy="400" r="26" fill="#10b981"/><path d="M155 400 l9 10 l18 -20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="210" y="410" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="700" fill="#1e1b4b">Checked out here</text><text x="150" y="490" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="500" fill="#475569"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#1e1b4b">HEAD</tspan> → <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700" fill="#8b5cf6">feature-login</tspan></text><path d="M640 335 H560" stroke="#10b981" stroke-width="6" stroke-linecap="round"/><path d="M572 322 L552 335 L572 348" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="1060" y="260" width="430" height="300" rx="22" fill="#fff5f5" stroke="#e5534b" stroke-width="3" stroke-dasharray="12 10"/><text x="1095" y="325" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="30" font-weight="800" fill="#e5534b">../myapp-login2</text><circle cx="1113" cy="400" r="26" fill="#e5534b"/><path d="M1102 389 l22 22 M1124 389 l-22 22" stroke="#fff" stroke-width="6" stroke-linecap="round"/><text x="1155" y="410" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="700" fill="#e5534b">Refused</text><text x="1095" y="478" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="500" fill="#1e1b4b">This branch is already</text><text x="1095" y="514" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="500" fill="#1e1b4b">in another worktree</text><path d="M960 335 H1040" stroke="#e5534b" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 12"/><rect x="300" y="600" width="1000" height="56" rx="12" fill="#fff5f5" stroke="#f3c4c1" stroke-width="2"/><text x="330" y="637" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="24" font-weight="600" fill="#e5534b">✕  git worktree add ../myapp-login2 feature-login</text><rect x="300" y="676" width="1000" height="96" rx="12" fill="#ecfdf5" stroke="#a7e9cf" stroke-width="2"/><text x="330" y="712" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="24" font-weight="800" fill="#10b981">Instead: give each task its own new branch</text><text x="330" y="752" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="24" font-weight="600" fill="#1e1b4b">✓  git worktree add -b fix-typo ../myapp-typo</text><rect x="350.0" y="800" width="900" height="62" rx="31" fill="#1e1b4b"/><text x="800" y="841" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="25" font-weight="700" fill="#fff"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" fill="#fcd34d">--force</tspan> overrides this, but both folders would edit one branch</text></svg>