<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f8fc"/><stop offset="1" stop-color="#edf1f8"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1e1b4b" flood-opacity="0.08"/></filter></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<text x="64" y="76" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="24" letter-spacing="5" fill="#475569">GIT WORKTREE · CLEANUP</text>
<text x="800.0" y="150" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="56" font-weight="800" fill="#1e1b4b">Cleaning Up: remove, prune, lock</text>
<text x="800.0" y="204" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="28" font-weight="500" fill="#475569">Check <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" fill="#8b5cf6" font-weight="700">git worktree list</tspan> first, then pick the right command</text><g filter="url(#sh)"><rect x="60" y="250" width="480" height="440" rx="22" fill="#fff"/></g><path d="M60 272 Q60 250 82 250 H518 Q540 250 540 272 V260 H60 Z" fill="#3b82f6"/><circle cx="110" cy="320" r="24" fill="#3b82f6"/><text x="110" y="330" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">1</text><text x="150" y="332" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="800" fill="#3b82f6">Done with it</text><rect x="88" y="358" width="130" height="44" rx="22" fill="#3b82f6"/><text x="108" y="389" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="25" font-weight="800" fill="#fff">remove</text><text x="236" y="389" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="22" font-weight="500" fill="#475569">Deletes folder &amp; record</text><rect x="84" y="428" width="432" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="102" y="461" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git worktree remove ../myapp-login</text><text x="102" y="494" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git branch -d feature-login</text><circle cx="100" cy="562" r="6" fill="#3b82f6"/><text x="118" y="570" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b">Refused if changes are uncommitted</text><circle cx="100" cy="608" r="6" fill="#3b82f6"/><text x="118" y="616" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b">The branch stays; delete it yourself</text><g filter="url(#sh)"><rect x="560" y="250" width="480" height="440" rx="22" fill="#fff"/></g><path d="M560 272 Q560 250 582 250 H1018 Q1040 250 1040 272 V260 H560 Z" fill="#f59e0b"/><circle cx="610" cy="320" r="24" fill="#f59e0b"/><text x="610" y="330" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">2</text><text x="650" y="332" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="800" fill="#f59e0b">Folder deleted by hand</text><rect x="588" y="358" width="115" height="44" rx="22" fill="#f59e0b"/><text x="608" y="389" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="25" font-weight="800" fill="#fff">prune</text><text x="721" y="389" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="22" font-weight="500" fill="#475569"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">list</tspan> marks it <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">prunable</tspan></text><rect x="584" y="428" width="432" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="602" y="461" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git worktree prune -n -v</text><text x="602" y="494" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git worktree prune</text><circle cx="600" cy="562" r="6" fill="#f59e0b"/><text x="618" y="570" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">-n</tspan> only lists; deletes nothing</text><circle cx="600" cy="608" r="6" fill="#f59e0b"/><text x="618" y="616" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b">Clears the leftover record</text><g filter="url(#sh)"><rect x="1060" y="250" width="480" height="440" rx="22" fill="#fff"/></g><path d="M1060 272 Q1060 250 1082 250 H1518 Q1540 250 1540 272 V260 H1060 Z" fill="#8b5cf6"/><circle cx="1110" cy="320" r="24" fill="#8b5cf6"/><text x="1110" y="330" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="26" font-weight="800" fill="#fff">3</text><text x="1150" y="332" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="30" font-weight="800" fill="#8b5cf6">On an external drive</text><rect x="1088" y="358" width="100" height="44" rx="22" fill="#8b5cf6"/><text x="1108" y="389" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="25" font-weight="800" fill="#fff">lock</text><text x="1206" y="389" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="22" font-weight="500" fill="#475569"><tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">list</tspan> marks it <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">locked</tspan></text><rect x="1084" y="428" width="432" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/><text x="1102" y="461" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git worktree lock ../myapp-usb</text><text x="1102" y="494" font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-size="19" font-weight="600" fill="#1e1b4b">git worktree unlock ../myapp-usb</text><circle cx="1100" cy="562" r="6" fill="#8b5cf6"/><text x="1118" y="570" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b">Locked: no prune, move, or remove</text><circle cx="1100" cy="608" r="6" fill="#8b5cf6"/><text x="1118" y="616" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="23" font-weight="500" fill="#1e1b4b">Add <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" font-weight="700">--reason</tspan> to say why</text><rect x="390.0" y="770" width="820" height="62" rx="31" fill="#1e1b4b"/><text x="800" y="811" text-anchor="middle" font-family="'Noto Sans','Noto Sans CJK TC',sans-serif" font-size="25" font-weight="700" fill="#fff">Don&#x27;t <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" fill="#fcd34d">rm -rf</tspan> a worktree; use <tspan font-family="'JetBrains Mono','Noto Sans Mono CJK TC',monospace" fill="#fcd34d">git worktree remove</tspan></text></svg>