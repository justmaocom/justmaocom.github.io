name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Check localized URLs
        run: ruby tools/check-i18n.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Check SEO output
        run: ruby tools/check-seo.rb "_site${{ steps.pages.outputs.base_path }}"

      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            \-\-disable-external \
            \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: List changed URLs for IndexNow
        id: indexnow
        run: |
          payload="$(ruby tools/indexnow.rb "_site${{ steps.pages.outputs.base_path }}")"
          echo "payload=$payload" >> "$GITHUB_OUTPUT"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  lib:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install npm packages
        run: npm ci

      - name: Check assets/lib matches package-lock.json
        run: |
          npm run sync-lib
          if [ -n "$(git status --porcelain -- assets/lib)" ]; then
            git status --short -- assets/lib
            git --no-pager diff --stat -- assets/lib
            echo "::error::assets/lib does not match package-lock.json. Run 'npm ci && npm run sync-lib', then commit assets/lib."
            exit 1
          fi

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, lib]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  indexnow:
    if: github.event_name != 'pull_request' && needs.build.outputs.indexnow != ''
    permissions: {}
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Submit changed URLs to IndexNow
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          curl -fsS -w '%{http_code}\n' https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-raw "$PAYLOAD"
