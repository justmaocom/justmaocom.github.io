version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Chirpy 7.6 搭配 mermaid 11；等 Chirpy 改用 12 再移除
    ignore:
      - dependency-name: mermaid
        update-types: ["version-update:semver-major"]
      # listmonk v6.2.0 的表單元件是 altcha 2.x，伺服器端是 altcha-lib-go v1；等 listmonk 改用 3.x 再移除
      - dependency-name: altcha
        update-types: ["version-update:semver-major"]
    groups:
      static-assets:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
