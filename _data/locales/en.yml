# 與主題 gem 內的 _data/locales/en.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: Projects
  privacy: Privacy Policy
  newsletter: Newsletter

# _includes/projects.html 的連結文字
projects:
  website: Visit site
  post: Write-up

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "Posts in :name"
  category_description: "Posts filed under :name (:count in total). Latest: :latest"
  page_title: "All Posts (Page :num)"
  page_description: "Page :num of all posts on JustMao, continuing the list, newest first."
  archives_description: "All :count posts on JustMao, newest first."
  categories_description: "Browse JustMao posts by topic: :count categories, each listing its posts."
  # 「專案」頁（_tabs/projects.md）的 <title> 與描述；寫成整頁的泛稱，不寫個別專案，新增專案時不用改
  projects_title: "Projects: Apps and Tools With Source Code"
  projects_description: "Software tools and web apps I've built myself. Each project links to its source code or live site, and to a write-up on how I built it when there is one."

# _includes/footer.html 頁尾各欄的標題
footer:
  explore: Explore
  connect: Connect

# _includes/newsletter-form.html 電子報表單的字串；altcha 是 ALTCHA 元件的 strings，沒列的沿用元件內建的英文
newsletter:
  email: Email address
  subscribe: Subscribe
  # 送出後顯示在表單下方；error 涵蓋 listmonk 拒絕與限流（429 讀不到內容，和斷線分不出來）
  success: "Thanks for subscribing! A confirmation email is on its way. Click the link in it to finish subscribing. If it hasn't arrived in a few minutes, check your spam folder."
  error: "The subscription didn't go through. Check your email address and try again in a minute."
  altcha:
    label: I'm not a robot
    verifying: Verifying…
    verified: Verified
    # 留空：驗證中再按訂閱時元件不跳 alert，畫面上已顯示 verifying 的文字
    waitAlert: ''
    verificationRequired: Verification required.
    error: Verification failed. Try again later.
    expired: Verification expired. Try again.

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: Clear
  results: "Results for “:query”: :count"

# _includes/topbar.html 的 AI 搜尋按鈕；modal 是 <search-modal-snippet> 的 translations，沒列的沿用元件內建的英文。
# 元件裡的「Powered by Cloudflare AI Search」寫死在元件內，不能翻譯
ai_search:
  button: AI search
  modal:
    placeholder: Search posts…
    searchButtonLabel: Search
    searchResultsAriaLabel: Search results
    loadingAriaLabel: Loading
    # 等待結果時輪流顯示，給了就整組取代元件內建的十句
    loadingMessages: [Searching…]
    modalEmptyStateDescription: Start typing to search
    modalNoResultsTitle: No results found
    # {query} 是搜尋字詞
    modalNoResultsDescription: "No posts match “{query}”"
    recentResults: Recent
    favoriteResults: Favorites
    addFavorite: Add to favorites
    removeFavorite: Remove from favorites
    navigateHint: Navigate
    selectHint: Open
    closeHint: Close
    errorPrefix: "Error:"

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: Switch color mode
