# 與主題 gem 內的 _data/locales/en.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: Projects

# _includes/projects.html 的連結文字
projects:
  website: Visit site
  post: Write-up

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "Posts in :name"
  category_description: "Posts filed under :name (:count in total). Latest: :latest"
  page_title: "All Posts (Page :num)"
  archives_description: "All :count posts on JustMao, newest first."
  categories_description: "Browse JustMao posts by topic: :count categories, each listing its posts."
  # 「專案」頁（_tabs/projects.md）的 <title> 與描述；寫成整頁的泛稱，不寫個別專案，新增專案時不用改
  projects_title: "Projects: Apps and Tools With Source Code"
  projects_description: "Software tools and web apps I've built myself. Each project links to its source code or live site, and to a write-up on how I built it when there is one."

# _includes/footer.html 頁尾兩欄的標題
footer:
  explore: Explore
  connect: Connect

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: Clear
  results: "Results for “:query”: :count"

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: Switch color mode
