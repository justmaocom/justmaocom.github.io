# 與主題 gem 內的 _data/locales/en.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: Projects

# _includes/projects.html 的連結文字
projects:
  website: Visit site
  post: Write-up

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼
seo:
  category_title: "Posts in :name"
  category_description: "Posts filed under :name (:count in total). Latest: :latest"
  page_title: "All Posts (Page :num)"
