# 與主題 gem 內的 _data/locales/zh-TW.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: 專案
  privacy: 隱私權政策
  newsletter: 電子報

# _includes/projects.html 的連結文字
projects:
  website: 開啟網站
  post: 介紹文章

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "「:name」分類文章"
  category_description: "「:name」分類下的 :count 篇文章，最新一篇是〈:latest〉。"
  page_title: "文章列表（第 :num 頁）"
  page_description: "JustMao 的文章列表第 :num 頁，接在前面幾頁之後，同樣依發布日期由新到舊排列。"
  archives_description: "JustMao 的全部 :count 篇文章，依發布日期由新到舊排列。"
  categories_description: "JustMao 的文章分類總覽：:count 個分類，各自列出底下的文章。"
  # 「專案」頁（_tabs/projects.md）的 <title> 與描述；寫成整頁的泛稱，不寫個別專案，新增專案時不用改
  projects_title: "專案：自己開發的工具與應用，附原始碼"
  projects_description: "JustMao 自己開發的工具與應用程式。每個專案都附上原始碼或網站連結，寫過開發過程的，也連到介紹文章。"

# _includes/footer.html 頁尾各欄的標題
footer:
  explore: 瀏覽
  connect: 聯繫

# _includes/newsletter-form.html 電子報表單的字串；altcha 是 ALTCHA 元件的 strings，沒列的沿用元件內建的英文
newsletter:
  email: 電子郵件地址
  subscribe: 訂閱
  # 送出後顯示在表單下方；error 涵蓋 listmonk 拒絕與限流（429 讀不到內容，和斷線分不出來）
  success: 謝謝訂閱！確認信已經寄出，點信裡的確認連結，訂閱才算完成。幾分鐘後還沒收到的話，請看看垃圾郵件匣。
  error: 沒有訂閱成功。請確認電子郵件地址，一分鐘後再試一次。
  altcha:
    label: 我不是機器人
    verifying: 驗證中…
    verified: 已驗證
    # 留空：驗證中再按訂閱時元件不跳 alert，畫面上已顯示 verifying 的文字
    waitAlert: ''
    verificationRequired: 請先完成驗證。
    error: 驗證失敗，請稍後再試。
    expired: 驗證已過期，請再試一次。

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: 清除
  results: "找到 :count 篇符合「:query」的文章"

# _includes/topbar.html 的 AI 搜尋按鈕；modal 是 <search-modal-snippet> 的 translations，沒列的沿用元件內建的英文。
# 元件裡的「Powered by Cloudflare AI Search」寫死在元件內，不能翻譯
ai_search:
  button: AI 搜尋
  modal:
    placeholder: 搜尋文章…
    searchButtonLabel: 搜尋
    searchResultsAriaLabel: 搜尋結果
    loadingAriaLabel: 載入中
    # 等待結果時輪流顯示，給了就整組取代元件內建的十句
    loadingMessages: [搜尋中…]
    modalEmptyStateDescription: 輸入關鍵字開始搜尋
    modalNoResultsTitle: 沒有搜尋結果
    # {query} 是搜尋字詞
    modalNoResultsDescription: "找不到符合「{query}」的文章"
    recentResults: 最近開啟
    favoriteResults: 收藏
    addFavorite: 加入收藏
    removeFavorite: 從收藏移除
    navigateHint: 切換
    selectHint: 開啟
    closeHint: 關閉
    errorPrefix: 錯誤：

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: 切換深淺色模式
