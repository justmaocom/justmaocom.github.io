# 與主題 gem 內的 _data/locales/zh-TW.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: 專案

# _includes/projects.html 的連結文字
projects:
  website: 開啟網站
  post: 介紹文章

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "「:name」分類文章"
  category_description: "「:name」分類下的 :count 篇文章，最新一篇是〈:latest〉。"
  page_title: "文章列表（第 :num 頁）"
  archives_description: "JustMao 的全部 :count 篇文章，依發布日期由新到舊排列。"
  categories_description: "JustMao 的文章分類總覽：:count 個分類，各自列出底下的文章。"
  # 「專案」頁（_tabs/projects.md）；_data/projects.yml 新增或移除專案時，三個語系一起改
  projects_title: "專案：政府採購法題庫練習平台"
  projects_description: "JustMao 自己開發的專案，附原始碼與介紹文章。目前收錄政府採購法題庫練習平台：把官方 PDF／DOCX 題庫匯入資料庫，每輪隨機抽題，並統計出弱項。"

# _includes/footer.html 頁尾兩欄的標題
footer:
  explore: 瀏覽
  connect: 聯繫

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: 清除
  results: "找到 :count 篇符合「:query」的文章"

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: 切換深淺色模式
