# 與主題 gem 內的 _data/locales/zh-CN.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: 项目

# _includes/projects.html 的連結文字
projects:
  website: 打开网站
  post: 介绍文章

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "“:name”分类文章"
  category_description: "“:name”分类下的 :count 篇文章，最新一篇是《:latest》。"
  page_title: "文章列表（第 :num 页）"
  archives_description: "JustMao 的全部 :count 篇文章，按发布日期由新到旧排列。"
  categories_description: "JustMao 的文章分类总览：:count 个分类，各自列出下面的文章。"
  # 「專案」頁（_tabs/projects.md）的 <title> 與描述；寫成整頁的泛稱，不寫個別專案，新增專案時不用改
  projects_title: "项目：自己开发的工具与应用，附源代码"
  projects_description: "JustMao 自己开发的工具与应用程序。每个项目都附上源代码或网站链接，写过开发过程的，也链接到介绍文章。"

# _includes/footer.html 頁尾各欄的標題
footer:
  explore: 浏览
  connect: 联系
  newsletter: 电子报

# _includes/footer.html 頁尾電子報表單的字串；altcha 是 ALTCHA 元件的 strings，沒列的沿用元件內建的英文
newsletter:
  description: 每周一封，整理 justmao.com 上周的新文章。
  email: 电子邮箱地址
  subscribe: 订阅
  altcha:
    label: 我不是机器人
    verifying: 验证中…
    verified: 已验证
    # 留空：驗證中再按訂閱時元件不跳 alert，畫面上已顯示 verifying 的文字
    waitAlert: ''
    verificationRequired: 请先完成验证。
    error: 验证失败，请稍后再试。
    expired: 验证已过期，请再试一次。

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: 清除
  results: "找到 :count 篇符合“:query”的文章"

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: 切换深浅色模式
