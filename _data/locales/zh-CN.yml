# 與主題 gem 內的 _data/locales/zh-CN.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: 项目

# _includes/projects.html 的連結文字
projects:
  website: 打开网站
  post: 介绍文章

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼；:count 在 tab 的描述裡是文章數或分類數
seo:
  category_title: "“:name”分类文章"
  category_description: "“:name”分类下的 :count 篇文章，最新一篇是《:latest》。"
  page_title: "文章列表（第 :num 页）"
  archives_description: "JustMao 的全部 :count 篇文章，按发布日期由新到旧排列。"
  categories_description: "JustMao 的文章分类总览：:count 个分类，各自列出下面的文章。"
  # 「專案」頁（_tabs/projects.md）；_data/projects.yml 新增或移除專案時，三個語系一起改
  projects_title: "项目：政府采购法题库练习平台"
  projects_description: "JustMao 自己开发的项目，附源代码与介绍文章。目前收录政府采购法题库练习平台：把官方 PDF／DOCX 题库导入数据库，每轮随机抽题，并统计出弱项。"

# _includes/footer.html 頁尾兩欄的標題
footer:
  explore: 浏览
  connect: 联系

# _includes/post-search.html 首頁搜尋欄的字串；:count 是結果篇數，:query 是搜尋字詞
search:
  clear: 清除
  results: "找到 :count 篇符合“:query”的文章"

# _includes/topbar.html 深淺色按鈕的 aria-label
theme:
  toggle: 切换深浅色模式
