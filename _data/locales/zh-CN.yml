# 與主題 gem 內的 _data/locales/zh-CN.yml 深度合併（Jekyll 4.3+），只放本站新增的字串

tabs:
  projects: 项目

# _includes/projects.html 的連結文字
projects:
  website: 打开网站
  post: 介绍文章

# _plugins/seo-hook.rb 產生的 <title> 與描述。
# :name 是分類名稱，:count 是該分類的文章數，:latest 是最新一篇的標題，:num 是頁碼
seo:
  category_title: "“:name”分类文章"
  category_description: "“:name”分类下的 :count 篇文章，最新一篇是《:latest》。"
  page_title: "文章列表（第 :num 页）"
